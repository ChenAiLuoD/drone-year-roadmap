# 第 3 周第 1 天短跑训练配置。
# 这个文件只固定实验条件，不保存训练权重或运行缓存。

# 模型规格：使用项目中已有的轻量 YOLO 预训练权重。
model: yolo26n.pt
model_version: yolo26n.pt

# 数据版本：由第二周生成的单类 vehicle YOLO 数据集。
data: configs/dataset_v0.2.yaml
data_version: uavdt-yolo-v0.2

# 输入和训练规模：1 个 epoch 只用于链路短跑验收。
imgsz: 640
epochs: 1
batch: 4

# 可复现性和设备：固定随机种子，使用第 0 张 CUDA GPU。
seed: 20261112
device: 0
deterministic: true
workers: 2

# 输出位置：runs/ 会被 .gitignore 忽略，日志和指标保留在本机。
project: runs/week3_day1
name: baseline_short_seed20261112
exist_ok: false
cache: false
